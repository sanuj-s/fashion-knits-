<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#f5f2ee"/>
  <defs>
    <pattern id="grid8" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e0d8" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#grid8)"/>
  <text x="20" y="30" font-family="monospace" font-size="8" fill="#8a8a8a" letter-spacing="1.5">SPEC // CUSTOM OEM & PRIVATE LABEL</text>
  <text x="20" y="42" font-family="monospace" font-size="7" fill="#c9a96e">BESPOKE BUYER TECH PACK DEVELOPMENT</text>

  <g transform="translate(50, 70)" stroke="#1a1a1a" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Engineering CAD Lines & Grading Grids -->
    <path d="M 50 15 L 25 35 L 5 80 L 35 95 L 48 65 L 48 240 L 152 240 L 152 65 L 165 95 L 195 80 L 175 35 L 150 15 Z" stroke="#1a1a1a" stroke-width="1.5" fill="#ffffff" fill-opacity="0.6"/>
    <!-- Grading Nest Lines (S, M, L, XL) -->
    <path d="M 48 230 L 152 230" stroke="#c9a96e" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M 48 220 L 152 220" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2,2"/>
    <!-- Measurement Dimensions -->
    <line x1="40" y1="65" x2="40" y2="240" stroke="#c9a96e" stroke-width="1"/>
    <line x1="37" y1="65" x2="43" y2="65" stroke="#c9a96e" stroke-width="1"/>
    <line x1="37" y1="240" x2="43" y2="240" stroke="#c9a96e" stroke-width="1"/>
    <text x="32" y="155" font-family="monospace" font-size="6" fill="#c9a96e" transform="rotate(-90 32 155)" text-anchor="middle">LENGTH +/-0.5cm</text>
    <!-- Chest Width Dimension -->
    <line x1="48" y1="110" x2="152" y2="110" stroke="#c9a96e" stroke-width="1"/>
    <text x="100" y="106" font-family="monospace" font-size="6" fill="#c9a96e" text-anchor="middle">CHEST 1/2</text>
  </g>
</svg>