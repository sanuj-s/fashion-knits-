    <circle cx="100" cy="35" r="2" fill="#c9a96e" stroke="#1a1a1a" stroke-width="0.75"/>
    <circle cx="100" cy="55" r="2" fill="#c9a96e" stroke="#1a1a1a" stroke-width="0.75"/>
    <circle cx="100" cy="75" r="2" fill="#c9a96e" stroke="#1a1a1a" stroke-width="0.75"/>
