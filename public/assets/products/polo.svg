  <text x="20" y="42" font-family="monospace" font-size="7" fill="#c9a96e">220-260 GSM HONEYCOMB PIQUE</text>

  <g transform="translate(50, 70)" stroke="#1a1a1a" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
