<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#f5f2ee"/>
  <defs>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e0d8" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#grid5)"/>
  <text x="20" y="30" font-family="monospace" font-size="8" fill="#8a8a8a" letter-spacing="1.5">SPEC // ATHLETIC ACTIVEWEAR</text>
  <text x="20" y="42" font-family="monospace" font-size="7" fill="#c9a96e">160-200 GSM QUICK-DRY INTERLOCK</text>

  <g transform="translate(50, 70)" stroke="#1a1a1a" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <path d="M 50 15 L 20 32 L 0 75 L 30 90 L 45 60 L 45 235 L 155 235 L 155 60 L 170 90 L 200 75 L 180 32 L 150 15" fill="#ffffff" fill-opacity="0.7"/>
    <!-- Ergonomic Flatlock Side Panels -->
    <path d="M 45 60 Q 60 145 55 235" stroke="#c9a96e" stroke-width="1.5"/>
    <path d="M 155 60 Q 140 145 145 235" stroke="#c9a96e" stroke-width="1.5"/>
    <!-- Dynamic Raglan Seams -->
    <path d="M 65 18 L 45 60" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="2,2"/>
    <path d="M 135 18 L 155 60" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- Athletic Curved Drop Hem -->
    <path d="M 45 235 Q 100 248 155 235" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Flatlock Collar -->
    <path d="M 50 15 Q 100 38 150 15" stroke="#1a1a1a" stroke-width="2"/>
  </g>
</svg>