    <path d="M 45 15 L 25 32 L 8 70 L 32 82 L 42 58 L 42 200 L 138 200 L 138 58 L 148 82 L 172 70 L 155 32 L 135 15" fill="#ffffff" fill-opacity="0.7"/>
