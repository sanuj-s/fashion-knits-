    <text x="90" y="108" font-family="sans-serif" font-size="6" font-weight="bold" fill="#c9a96e" text-anchor="middle">100%</text>
    <text x="90" y="115" font-family="sans-serif" font-size="4.5" fill="#8a8a8a" text-anchor="middle">ORGANIC</text>
