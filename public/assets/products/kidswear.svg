  <text x="20" y="42" font-family="monospace" font-size="7" fill="#c9a96e">OEKO-TEX CLASS I BABY-SAFE ORGANIC</text>

  <g transform="translate(60, 90)" stroke="#1a1a1a" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
