<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#f5f2ee"/>
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e0d8" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#grid4)"/>
  <text x="20" y="30" font-family="monospace" font-size="8" fill="#8a8a8a" letter-spacing="1.5">SPEC // PULLOVER HOODIE</text>
  <text x="20" y="42" font-family="monospace" font-size="7" fill="#c9a96e">340-420 GSM BRUSHED FLEECE</text>

  <g transform="translate(50, 50)" stroke="#1a1a1a" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 3-Piece Lined Hood -->
    <path d="M 65 50 C 45 10, 70 -15, 100 -15 C 130 -15, 155 10, 135 50" fill="#e8e4dc" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M 82 -15 Q 100 20 100 50" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Drawcords with metal aglets -->
    <path d="M 88 52 Q 85 95 82 105" stroke="#c9a96e" stroke-width="1.5"/>
    <path d="M 112 52 Q 115 95 118 105" stroke="#c9a96e" stroke-width="1.5"/>
    <!-- Body & Long Sleeves -->
    <path d="M 55 48 L 18 75 L -20 210 L 10 220 L 44 115 L 44 250 L 156 250 L 156 115 L 190 220 L 220 210 L 182 75 L 145 48" fill="#ffffff" fill-opacity="0.7"/>
    <!-- Kangaroo Pocket -->
    <path d="M 65 175 L 80 150 L 120 150 L 135 175 L 135 235 L 65 235 Z" fill="#f5f2ee" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Ribbed Hem Band -->
    <rect x="44" y="250" width="112" height="18" fill="#e8e4dc" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
</svg>