<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#f5f2ee"/>
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e0d8" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#grid3)"/>
  <text x="20" y="30" font-family="monospace" font-size="8" fill="#8a8a8a" letter-spacing="1.5">SPEC // CREW SWEATSHIRT</text>
  <text x="20" y="42" font-family="monospace" font-size="7" fill="#c9a96e">320-380 GSM FRENCH TERRY / FLEECE</text>

  <g transform="translate(50, 70)" stroke="#1a1a1a" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body & Long Sleeves -->
    <path d="M 55 18 L 18 45 L -20 180 L 10 190 L 44 85 L 44 225 L 156 225 L 156 85 L 190 190 L 220 180 L 182 45 L 145 18" fill="#ffffff" fill-opacity="0.7"/>
    <!-- Raglan Seams -->
    <line x1="68" y1="24" x2="44" y2="85" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="132" y1="24" x2="156" y2="85" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="2,2"/>
    <!-- Triangular Neck Insert (V-Stitch) -->
    <path d="M 90 28 L 100 42 L 110 28" stroke="#c9a96e" stroke-width="1.2"/>
    <!-- Heavy Ribbed Collar -->
    <path d="M 55 18 Q 100 40 145 18" stroke="#1a1a1a" stroke-width="2.2"/>
    <path d="M 55 18 Q 100 10 145 18" stroke="#8a8a8a" stroke-width="1"/>
    <!-- Heavy Ribbed Hem Band -->
    <rect x="44" y="225" width="112" height="18" fill="#e8e4dc" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Ribbed Cuffs -->
    <path d="M -20 180 L 10 190 L 7 205 L -23 195 Z" fill="#e8e4dc" stroke="#1a1a1a" stroke-width="1.2"/>
    <path d="M 220 180 L 190 190 L 193 205 L 223 195 Z" fill="#e8e4dc" stroke="#1a1a1a" stroke-width="1.2"/>
  </g>
</svg>