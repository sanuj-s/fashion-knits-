<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%">
  <!-- SMETA Logo -->
  <g>
    <!-- SMETA text -->
    <text x="24" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#58636d" letter-spacing="-0.5">SMETA</text>
    <text x="216" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#717c86">®</text>

    <!-- 3 circular dots mark -->
