      <!-- Large dark grey circle -->
      <circle cx="-6" cy="-14" r="16" fill="#58636d" />
      <!-- Pink/red circle -->
      <circle cx="16" cy="-8" r="14" fill="#e93b63" />
      <!-- Small light grey circle -->
